plugins { id 'com.android.application' }

def stableSigningReady = [
    System.getenv('ANDROID_SIGNING_STORE_FILE'),
    System.getenv('ANDROID_SIGNING_STORE_PASSWORD'),
    System.getenv('ANDROID_SIGNING_KEY_ALIAS'),
    System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.personal.jdassistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.personal.jdassistant'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        stable {
            if (stableSigningReady) {
                storeFile file(System.getenv('ANDROID_SIGNING_STORE_FILE'))
                storePassword System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (stableSigningReady) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            if (stableSigningReady) {
                signingConfig signingConfigs.stable
            }
            minifyEnabled false
        }
    }
}
