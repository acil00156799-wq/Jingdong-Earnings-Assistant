name: Build Android APK

on:
  push:
    branches: ["main", "kola-inspired-private-app"]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate task module and embedded JavaScript
        run: |
          node --check app/src/main/assets/task-modules.js
          node - <<'NODE'
          global.window = global;
          require("./app/src/main/assets/task-modules.js");
          const tasks = global.JD_TASK_MODULES;
          if (!Array.isArray(tasks) || tasks.length !== 6) throw new Error("Expected six registered task modules");
          const ids = tasks.map(task => task.id);
          if (new Set(ids).size !== ids.length) throw new Error("Task IDs must be unique");
          const bean = tasks.find(task => task.id === "bean_checkin");
          if (!bean || bean.capability !== "assisted_click" || JSON.stringify(bean.labels) !== JSON.stringify(["签到领京豆", "领取京豆"])) {
            throw new Error("Bean check-in must use only the two approved exact labels");
          }
          if (tasks.filter(task => task.id !== "bean_checkin").some(task => task.capability !== "manual_only")) {
            throw new Error("Unverified modules must remain manual-only");
          }
          NODE
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          Path("/tmp/jd-assistant-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/jd-assistant-inline.js
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jingdong-Earnings-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
